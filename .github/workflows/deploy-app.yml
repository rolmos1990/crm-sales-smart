name: Build & Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:  # permite lanzar manualmente desde GitHub

env:
  APP_IMAGE: ${{ secrets.DOCKER_IMAGE }}
  WORKER_IMAGE: ${{ secrets.DOCKER_IMAGE_WORKER }}

jobs:
  # ── App (Next.js) ──────────────────────────────────────────────────────────
  build-app:
    name: App — Next.js
    runs-on: ubuntu-latest
    environment: PRODUCTION
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build y Push — App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          # Variables NEXT_PUBLIC_* se compilan dentro de la imagen en next build
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TEMPLATES_URL=${{ secrets.NEXT_PUBLIC_TEMPLATES_URL }}
          cache-from: type=gha,scope=app
          cache-to:   type=gha,scope=app,mode=max

  # ── Worker (RabbitMQ consumers) ────────────────────────────────────────────
  build-worker:
    name: Worker — RabbitMQ
    runs-on: ubuntu-latest
    environment: PRODUCTION
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build y Push — Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to:   type=gha,scope=worker,mode=max

  # 🚀 Deploy Coolify — App
  deploy-coolify-app:
    name: Deploy Coolify — App
    runs-on: ubuntu-latest
    environment: PRODUCTION
    needs: build-app

    steps:
      - name: Update Coolify (image + tag)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          BUILD_VERSION: ${{ github.sha }}
        run: |
          curl -sSf -X PATCH "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APPLICATION_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"docker_registry_image_name\": \"${DOCKER_IMAGE}\",
              \"docker_registry_image_tag\": \"${BUILD_VERSION}\"
            }"

      - name: Deploy Coolify Application
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
        run: |
          curl -sSf \
            -H "Authorization: Bearer ${COOLIFY_API_KEY}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APPLICATION_UUID}&force=false"

  # 🚀 Deploy Coolify — Worker
  deploy-coolify-worker:
    name: Deploy Coolify — Worker
    runs-on: ubuntu-latest
    environment: PRODUCTION
    needs: build-worker

    steps:
      - name: Update Coolify (image + tag)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          COOLIFY_APPLICATION_UUID_WORKER: ${{ secrets.COOLIFY_APPLICATION_UUID_WORKER }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_WORKER }}
          BUILD_VERSION: ${{ github.sha }}
        run: |
          curl -sSf -X PATCH "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APPLICATION_UUID_WORKER}" \
            -H "Authorization: Bearer ${COOLIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"docker_registry_image_name\": \"${DOCKER_IMAGE}\",
              \"docker_registry_image_tag\": \"${BUILD_VERSION}\"
            }"

      - name: Deploy Coolify Application
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          COOLIFY_APPLICATION_UUID_WORKER: ${{ secrets.COOLIFY_APPLICATION_UUID_WORKER }}
        run: |
          curl -sSf \
            -H "Authorization: Bearer ${COOLIFY_API_KEY}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APPLICATION_UUID_WORKER}&force=false"

  # ── Resumen al terminar ────────────────────────────────────────────────────
  summary:
    name: Resumen
    runs-on: ubuntu-latest
    needs: [build-app, build-worker, deploy-coolify-app, deploy-coolify-worker]
    if: always()

    steps:
      - name: Resultado
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen | Tag | Build | Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| App | \`${{ github.sha }}\` | ${{ needs.build-app.result }} | ${{ needs.deploy-coolify-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | \`${{ github.sha }}\` | ${{ needs.build-worker.result }} | ${{ needs.deploy-coolify-worker.result }} |" >> $GITHUB_STEP_SUMMARY
